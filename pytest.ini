[pytest]
testpaths = sidecar/tests
norecursedirs = .git .pytest_cache .ruff_cache node_modules dist build tmp src-tauri/target
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers --strict-config --tb=short -ra --durations=15 --timeout=30 -m "not performance"
xfail_strict = true
markers =
    unit: isolated, fast component tests
    integration: tests crossing component, API, database, or service boundaries
    security: adversarial, authorization, ACL, and trust-boundary tests
    e2e: complete user or orchestration flows
    e2e_real: end-to-end tests against the compiled sidecar.exe binary
    adversarial: simulated attacks (prompt injection, SSRF, path traversal)
    performance: benchmarks that intentionally repeat comparatively expensive operations
    stability: resilience tests for crashes, corruption, and network failures
    production: FASE 6 real-component production tests (real orchestrator, gateway, pipeline, storage, router)
    stress: FASE 6 Level 4 concurrent load tests (default scale 100 users x 10 tasks)
    chaos: FASE 6 Level 5 fault-injection tests (model, database, tool, network failures)
