# Permission level definitions and dangerous tool mappings.
# Effect values: allow, deny, require_confirm
permission_levels:
  view:
    write: deny
    read: allow
    dangerous: deny
  confirm:
    write: allow
    read: allow
    dangerous: require_confirm
  auto:
    write: allow
    read: allow
    dangerous: require_confirm
  admin:
    write: allow
    read: allow
    dangerous: allow

# Tool IDs (or substrings) considered dangerous.
dangerous_tools:
  - "executor.command"
  - "executor.kill"
  - "executor.launch"
  - "filesystem.write"
  - "filesystem.delete"
  - "pipeline.report"

# System paths that require special handling.
critical_paths:
  - "C:\\Windows\\System32"
  - "C:\\Windows"
  - "C:\\Program Files"
  - "%USERPROFILE%\\AppData"

# Emergency stop default state.
emergency_stop:
  default_state: false

# Tool-to-permission mapping for policy evaluation.
tool_permissions:
  filesystem.read: ["filesystem.read"]
  filesystem.write: ["filesystem.write"]
  filesystem.list: ["filesystem.read"]
  filesystem.search: ["filesystem.read"]
  executor.command: ["executor.command"]
  executor.launch: ["executor.launch"]
  executor.kill: ["executor.kill"]
  system.info: ["system.read"]
  system.cpu: ["system.read"]
  system.processes: ["system.read"]
  audit.list: ["audit.read"]
  fleet.status: ["fleet.read"]
  fleet.qr: ["fleet.read"]
  fleet.list_devices: ["fleet.read"]
  fleet.export_sync: ["fleet.read"]
  fleet.sync_log: ["fleet.read"]
  fleet.generate_pairing: ["fleet.admin"]
  fleet.revoke_pairing: ["fleet.admin"]
  fleet.toggle_remote: ["fleet.admin"]
  fleet.register_device: ["fleet.admin"]
  fleet.update_device: ["fleet.admin"]
  fleet.delete_device: ["fleet.admin"]
  fleet.sync_push: ["fleet.admin"]
  fleet.sync_pull: ["fleet.admin"]
  fleet.receive_sync: ["fleet.admin"]
  permissions.status: ["permissions.read"]
  permissions.confirm: ["permissions.admin"]
  permissions.set_level: ["permissions.admin"]
  permissions.emergency: ["permissions.admin"]
  permissions.add_rule: ["permissions.admin"]
  permissions.remove_rule: ["permissions.admin"]
  plugins.list: ["plugins.read"]
  plugins.templates: ["plugins.read"]
  plugins.load: ["plugins.admin"]
  plugins.unload: ["plugins.admin"]
  plugins.reload: ["plugins.admin"]
  plugins.toggle: ["plugins.admin"]
  plugins.create: ["plugins.admin"]
  plugins.install_url: ["plugins.admin"]
  plugins.install_zip: ["plugins.admin"]
  vault.create: ["vault.write"]
  vault.update: ["vault.write"]
  vault.delete: ["vault.write"]
  vault.reveal: ["vault.write"]
  vault.rotate_secret: ["vault.write"]
  vault.rotate_master_key: ["vault.write"]
  admin.config_set: ["admin.config"]
  admin.config_delete: ["admin.config"]
  admin.backup: ["admin.backup"]
  chat.respond: ["chat.respond"]
