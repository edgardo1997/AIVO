name: Build Internal Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-internal-alpha-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: python -m uv sync --frozen

      - name: Build internal-alpha
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build-alpha.ps1 -Channel internal-alpha -SkipTests

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-canonical
          path: sidecar/dist/sidecar.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-internal-alpha
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: internal-alpha-manifest
          path: artifacts/internal-alpha/manifest.json
