name: Reproducible Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.10"
  NODE_VERSION: "24.18.0"
  SENTINEL_ENABLE_ACL: "0"
  SENTINEL_ENABLE_FLEET_STARTUP: "0"
  SENTINEL_JWT_SECRET: "ci-jwt-secret-not-for-production"

jobs:
  python-gates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync Python dependencies
        run: python -m uv sync --frozen

      - name: Constitutional gates
        run: python -m uv run python -m pytest -m alpha_constitutional_gate -q

      - name: Unit tests
        run: python -m uv run python -m pytest -m unit -q --durations=15

      - name: Integration tests
        run: python -m uv run python -m pytest -m integration -q --durations=15

      - name: Security tests
        run: python -m uv run python -m pytest -m security -q --durations=15

  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  sidecar-build:
    runs-on: windows-latest
    needs: [python-gates]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - run: python -m uv sync --frozen
      - run: cd sidecar && python -m uv run pyinstaller sidecar.spec --noconfirm

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-windows
          path: sidecar/dist/sidecar.exe
